<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Træningslog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151b;
    --panel:#1a1f27;
    --panel-2:#212733;
    --line:#2b3240;
    --text:#eef1f5;
    --text-dim:#8b93a3;
    --chalk:#f2c94c;
    --teal:#3fd1b5;
    --red:#ef5b5b;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif; overscroll-behavior-y:none;}
  h1,h2,h3,.brand,.tabbtn{font-family:'Oswald',sans-serif;}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,var(--bg) 80%, transparent);
    padding:14px 16px 6px;
  }
  .brand{font-size:22px; font-weight:700; letter-spacing:.5px; margin:0 0 12px;
    display:flex; align-items:baseline; gap:8px;}
  .brand span{font-size:14px; font-weight:500; color:var(--text-dim);}

  .tabs{display:flex; gap:8px; background:var(--panel); padding:5px; border-radius:12px;}
  .tabbtn{flex:1; text-align:center; padding:10px 4px; border-radius:9px; border:none;
    background:transparent; color:var(--text-dim); font-size:15px; font-weight:600;
    letter-spacing:.4px; cursor:pointer;}
  .tabbtn.active{background:var(--chalk); color:#1a1607;}

  main{padding:14px 16px 140px; max-width:640px; margin:0 auto;}

  .daymeta{display:flex; justify-content:space-between; align-items:center; margin:14px 2px 10px; gap:10px;}
  .daymeta .date{color:var(--text-dim); font-size:13px;}
  .daymeta .last-saved{color:var(--teal); font-size:12px; text-align:right; white-space:nowrap;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:12px; overflow:hidden;}
  .card-head{display:flex; align-items:center; gap:12px; padding:14px 14px 10px;}
  .icon{width:34px; height:34px; flex:none; color:var(--chalk); opacity:.9;}
  .titlewrap{position:relative; flex:1; min-width:0;}
  .card-head h3{margin:0; font-size:17px; font-weight:600; letter-spacing:.2px;}
  .card-head h3 .caret{color:var(--text-dim); font-size:12px; margin-left:5px; vertical-align:middle;}
  .card-head .meta{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  /* Usynlig native dropdown ovenpå titlen */
  .exsel{position:absolute; inset:0; width:100%; height:100%;
    opacity:0; border:none; background:transparent; font-size:16px; cursor:pointer;}
  .superset-tag{font-size:11px; color:var(--teal); border:1px solid var(--teal);
    border-radius:20px; padding:2px 8px; white-space:nowrap;}
  .delbtn{flex:none; width:26px; height:26px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text-dim); font-size:15px; line-height:1; cursor:pointer;}

  .sets{padding:0 12px 4px;}
  .grid{display:grid; grid-template-columns:18px 38px 1fr 38px 1fr 22px; gap:5px; align-items:center;}
  .setrow{padding:7px 0; border-top:1px solid var(--line);}
  .setrow:first-child{border-top:none;}
  .setnum{color:var(--text-dim); font-size:13px; font-weight:600;}
  .last{font-size:13px; color:#4b5361; text-align:center; font-weight:600; overflow:hidden;}
  .last.has{color:var(--chalk);}
  .field{position:relative;}
  .field input{width:100%; background:var(--panel-2); border:1px solid var(--line);
    border-radius:9px; color:var(--text); font-size:16px; font-weight:600;
    padding:9px 4px; text-align:center;}
  .field input::placeholder{color:#4b5361; font-weight:500;}
  .done{width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line);
    background:var(--panel-2); cursor:pointer; display:flex; align-items:center;
    justify-content:center; padding:0;}
  .done.checked{background:var(--teal); border-color:var(--teal);}
  .done.checked::after{content:"✓"; color:#0d1b18; font-size:14px; font-weight:700;}

  .cardfoot{display:flex; gap:8px; padding:2px 14px 12px;}
  .minibtn{background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;}

  .note{padding:0 14px 12px; font-size:12.5px; color:var(--text-dim); font-style:italic;}

  .col-labels{padding:0 12px 2px; font-size:10px; color:#5c6473;
    text-transform:uppercase; letter-spacing:.4px;}
  .col-labels span{text-align:center; overflow:hidden;}
  .col-labels .sidst{color:#6f6338;}

  .addbtn{width:100%; background:var(--panel); border:1px dashed var(--line); color:var(--text-dim);
    border-radius:var(--radius); padding:14px; font-size:14px; font-weight:600; cursor:pointer;}
  .restorebtn{display:block; margin:14px auto 0; background:none; border:none;
    color:#5c6473; font-size:12px; text-decoration:underline; cursor:pointer;}

  footer{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:linear-gradient(0deg, var(--bg) 70%, transparent);
    padding:10px 16px 16px;
  }
  .footwrap{max-width:640px; margin:0 auto; display:flex; gap:10px;}
  .btn{flex:1; border:none; border-radius:12px; padding:14px 10px; font-family:'Oswald',sans-serif;
    font-size:15px; font-weight:600; letter-spacing:.3px; cursor:pointer;}
  .btn-primary{background:var(--chalk); color:#1a1607;}
  .btn-ghost{background:var(--panel-2); color:var(--text); border:1px solid var(--line); flex:0 0 46px;}

  .toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px);
    background:var(--teal); color:#0d1b18; font-weight:600; font-size:14px;
    padding:10px 18px; border-radius:30px; opacity:0; transition:.25s; z-index:40; pointer-events:none;
    max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="brand">Træningslog <span id="today"></span></div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="daymeta">
    <span class="date" id="daysubtitle"></span>
    <span class="last-saved" id="lastSavedLabel"></span>
  </div>
  <div id="exerciseList"></div>
  <button class="addbtn" id="addExBtn">＋ Tilføj øvelse</button>
  <button class="restorebtn" id="restoreBtn">Gendan standardprogram for denne dag</button>
</main>

<footer>
  <div class="footwrap">
    <button class="btn btn-ghost" id="resetBtn" title="Ryd felterne">↺</button>
    <button class="btn btn-primary" id="saveBtn">Gem træning</button>
  </div>
</footer>

<div class="toast" id="toast"></div>

/* ---------- Øvelsesbibliotek (dropdown) ---------- */

/* ---------- Standardprogram ---------- */
const PROGRAM = {
  bryst: {
    label:"Bryst", subtitle:"Bænk · Incline · Flyes · Triceps",
    exercises:[
      {name:"Bænkpres (tung)", icon:"barbell", reps:"3-5", n:2},
      {name:"Pause-bænk", icon:"barbell", reps:"5-7", n:2},
      {name:"Incline bænkpres (maskine)", icon:"machine", reps:"5-7", n:4},
      {name:"Flyes – fokus øvre bryst", icon:"dumbbell", reps:"5-7", n:3},
      {name:"Close grip bænk (Smith) – triceps", icon:"barbell", reps:"7-10", n:3},
      {name:"Lateral raise (maskine)", icon:"machine", reps:"7-10", n:4, superset:"Superset A", note:"Skiftevis med Triceps pushdown"},
      {name:"Triceps pushdown", icon:"cable", reps:"8-12", n:4, superset:"Superset A", note:"Skiftevis med Lateral raise"},
    ]
  },
  ben: {
    label:"Ben", subtitle:"Hacksquat · Curl · Extension · Calves",
    exercises:[
      {name:"Hacksquat", icon:"legs", reps:"5-8", n:4},
      {name:"Lying leg curl", icon:"machine", reps:"8-10", n:4},
      {name:"Leg extension", icon:"machine", reps:"8-10", n:3},
      {name:"Calf raises", icon:"legs", reps:"8-10", n:4, superset:"Superset A", note:"Skiftevis med Ab crunches (cable)"},
      {name:"Ab crunches (cable)", icon:"cable", reps:"8-10", n:4, superset:"Superset A", note:"Skiftevis med Calf raises"},
      {name:"Ekstra sæt – til failure", icon:"legs", reps:"AMRAP", n:1, note:"Kør kun hvis der er mere i tanken"},
    ]
  },
  ryg: {
    label:"Ryg", subtitle:"Pullover · Row · Pulldown · Arme",
    exercises:[
      {name:"Lat pullover", icon:"cable", reps:"10-12", n:4},
      {name:"T-bar row", icon:"row", reps:"5-8", n:4},
      {name:"Lat pulldown", icon:"cable", reps:"8-10", n:3},
      {name:"Face pull", icon:"cable", reps:"10-12", n:3},
      {name:"Biceps curl", icon:"dumbbell", reps:"8-12", n:3},
      {name:"Hammer curl", icon:"dumbbell", reps:"8-12", n:3},
      {name:"Behind the back forearm", icon:"cable", reps:"8-10", n:2},
    ]
  }
};

const DAY_ORDER = ["bryst","ben","ryg"];
let currentDay = localStorage.getItem("tl_currentDay") || "bryst";

/* ---------- Storage ----------
   w / r / done : det du taster ind lige nu (gemmes løbende som kladde)
   pw / pr / pd : sidste GEMTE træning - vises i de to Sidst-kolonner.
   Tallene rykker først over i Sidst når du trykker "Gem træning". */
const keyLog   = d => `tl_log_${d}`;
const keyPlan  = d => `tl_plan_${d}`;
const keySaved = d => `tl_saved_${d}`;

function loadJSON(key, fb){ try{ const v = JSON.parse(localStorage.getItem(key)); return v ?? fb; }catch(e){ return fb; } }
function saveJSON(key, obj){ localStorage.setItem(key, JSON.stringify(obj)); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function setKey(name, si){ return `${name}#${si}`; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function has(v){ return v !== undefined && v !== null && v !== ""; }

/* ---------- Migrering fra tidligere versioner ---------- */
(function migrate(){
  if(!localStorage.getItem("tl_migrated_v2")){
    DAY_ORDER.forEach(d=>{
      const log = loadJSON(keyLog(d), {}), out = {};
      Object.keys(log).forEach(k=>{
        const m = k.match(/^(\d+)-(\d+)$/);
        if(m){ const ex = PROGRAM[d].exercises[+m[1]]; if(ex) out[setKey(ex.name, +m[2])] = log[k]; }
        else out[k] = log[k];
      });
      saveJSON(keyLog(d), out);
    });
    localStorage.setItem("tl_migrated_v2","1");
  }
  if(!localStorage.getItem("tl_migrated_v3")){
    const t = todayISO();
    DAY_ORDER.forEach(d=>{
      const log = loadJSON(keyLog(d), {});
      Object.values(log).forEach(e=>{
        if(e && e.d && e.d !== t && (has(e.w) || has(e.r))){
          e.pw = e.w; e.pr = e.r; e.pd = e.d;
          e.w = ""; e.r = ""; e.done = false;
        }
      });
      saveJSON(keyLog(d), log);
    });
    localStorage.setItem("tl_migrated_v3","1");
  }
})();

function defaultPlan(day){ return PROGRAM[day].exercises.map(e=>({...e})); }
function getPlan(day){
  const p = loadJSON(keyPlan(day), null);
  return (Array.isArray(p) && p.length) ? p : defaultPlan(day);
}
function savePlan(day, plan){ saveJSON(keyPlan(day), plan); }
function findInLibrary(name){
  for(const g of Object.values(LIBRARY)){
    const hit = g.items.find(i=>i.name === name);
    if(hit) return hit;
  }
  return null;
}

/* ---------- Dropdown ---------- */
function buildSelect(currentName){
  const known = !!findInLibrary(currentName);
  let html = `<select class="exsel">`;
  if(!known) html += `<optgroup label="Din øvelse"><option selected>${esc(currentName)}</option></optgroup>`;
  for(const g of Object.values(LIBRARY)){
    html += `<optgroup label="${esc(g.label)}">`;
    g.items.forEach(it=>{
      html += `<option value="${esc(it.name)}"${(known && it.name===currentName)?" selected":""}>${esc(it.name)}</option>`;
    });
    html += `</optgroup>`;
  }
  html += `<optgroup label="Andet"><option value="__custom">➕ Egen øvelse…</option></optgroup></select>`;
  return html;
}

/* ---------- Render ---------- */
function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  DAY_ORDER.forEach(d=>{
    const b = document.createElement("button");
    b.className = "tabbtn" + (d===currentDay ? " active":"");
    b.textContent = PROGRAM[d].label;
    b.onclick = ()=>{ currentDay = d; localStorage.setItem("tl_currentDay", d); renderAll(); };
    tabs.appendChild(b);
  });
}
function fmtDate(){ return new Date().toLocaleDateString("da-DK",{weekday:"short", day:"numeric", month:"short"}); }
function shortDate(iso){ return iso ? new Date(iso).toLocaleDateString("da-DK",{day:"numeric",month:"short"}) : ""; }

function renderDay(){
  const day = PROGRAM[currentDay];
  const plan = getPlan(currentDay);
  document.getElementById("daysubtitle").textContent = day.subtitle;
  document.getElementById("today").textContent = fmtDate();

  const log = loadJSON(keyLog(currentDay), {});
  const savedDate = localStorage.getItem(keySaved(currentDay))
    || Object.values(log).map(v=>v && v.pd).filter(Boolean).sort().pop();
  document.getElementById("lastSavedLabel").textContent = savedDate
    ? `Sidst gemt: ${shortDate(savedDate)}`
    : "Ingen gemte træninger endnu";

  const list = document.getElementById("exerciseList");
  list.innerHTML = "";

  plan.forEach((ex, ei)=>{
    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `
      <div class="icon">${ICONS[ex.icon] || ICONS.barbell}</div>
      <div class="titlewrap">
        <h3>${esc(ex.name)}<span class="caret">▼</span></h3>
        <div class="meta">${ex.n} sæt · ${esc(ex.reps)} reps</div>
        ${buildSelect(ex.name)}
      </div>
      ${ex.superset ? `<span class="superset-tag">${esc(ex.superset)}</span>` : ""}
      <button class="delbtn" data-del="${ei}" title="Fjern øvelse">×</button>
    `;
    card.appendChild(head);

    if(ex.note){
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = ex.note;
      card.appendChild(note);
    }

    const labels = document.createElement("div");
    labels.className = "col-labels grid";
    labels.innerHTML = `<span></span><span class="sidst">Sidst</span><span>Kg</span><span class="sidst">Sidst</span><span>Reps</span><span></span>`;
    card.appendChild(labels);

    const setsWrap = document.createElement("div");
    setsWrap.className = "sets";

    for(let si=0; si<ex.n; si++){
      const id = setKey(ex.name, si);
      const s = log[id] || {};
      const lastW = has(s.pw) ? s.pw : null;
      const lastR = has(s.pr) ? s.pr : null;
      const tip = s.pd ? `Sidste træning ${shortDate(s.pd)}` : "";

      const row = document.createElement("div");
      row.className = "setrow grid";
      row.innerHTML = `
        <span class="setnum">${si+1}</span>
        <span class="last ${lastW!==null?'has':''}" title="${tip}">${lastW!==null?esc(lastW):"—"}</span>
        <div class="field">
          <input type="number" inputmode="decimal" placeholder="${lastW!==null?esc(lastW):'kg'}" value="${esc(s.w ?? "")}" data-id="${esc(id)}" data-field="w">
        </div>
        <span class="last ${lastR!==null?'has':''}" title="${tip}">${lastR!==null?esc(lastR):"—"}</span>
        <div class="field">
          <input type="number" inputmode="numeric" placeholder="${lastR!==null?esc(lastR):esc(ex.reps)}" value="${esc(s.r ?? "")}" data-id="${esc(id)}" data-field="r">
        </div>
        <button class="done ${s.done?'checked':''}" data-id="${esc(id)}"></button>
      `;
      setsWrap.appendChild(row);
    }
    card.appendChild(setsWrap);

    const foot = document.createElement("div");
    foot.className = "cardfoot";
    foot.innerHTML = `
      <button class="minibtn" data-sets="minus" data-ex="${ei}">− sæt</button>
      <button class="minibtn" data-sets="plus" data-ex="${ei}">+ sæt</button>
    `;
    card.appendChild(foot);

    list.appendChild(card);
  });

  wireEvents();
}

/* ---------- Events ---------- */
function wireEvents(){
  const list = document.getElementById("exerciseList");

  list.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const log = loadJSON(keyLog(currentDay), {});
      const id = inp.dataset.id;
      log[id] = log[id] || {};
      log[id][inp.dataset.field] = inp.value;
      saveJSON(keyLog(currentDay), log);
    });
  });

  list.querySelectorAll(".done").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const log = loadJSON(keyLog(currentDay), {});
      const id = btn.dataset.id;
      log[id] = log[id] || {};
      log[id].done = !log[id].done;
      saveJSON(keyLog(currentDay), log);
      btn.classList.toggle("checked", !!log[id].done);
    });
  });

  list.querySelectorAll(".exsel").forEach((sel, ei)=>{
    sel.addEventListener("change", ()=>{
      const p = getPlan(currentDay);
      if(sel.value === "__custom"){
        const navn = prompt("Navn på øvelsen:");
        if(!navn){ renderDay(); return; }
        p[ei] = {name:navn.trim(), icon:"barbell", reps:p[ei].reps, n:p[ei].n, superset:p[ei].superset};
      } else {
        const lib = findInLibrary(sel.value);
        p[ei] = {name:sel.value, icon:lib?lib.icon:"barbell", reps:lib?lib.reps:p[ei].reps,
                 n:p[ei].n, superset:p[ei].superset};
      }
      savePlan(currentDay, p);
      renderDay();
    });
  });

  list.querySelectorAll("[data-sets]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const p = getPlan(currentDay), i = +btn.dataset.ex;
      p[i].n = btn.dataset.sets === "plus" ? Math.min(10, p[i].n+1) : Math.max(1, p[i].n-1);
      savePlan(currentDay, p);
      renderDay();
    });
  });

  list.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const p = getPlan(currentDay), i = +btn.dataset.del;
      if(!confirm(`Fjern "${p[i].name}" fra ${PROGRAM[currentDay].label}?\n(Dine gamle tal for øvelsen bevares.)`)) return;
      p.splice(i,1);
      savePlan(currentDay, p);
      renderDay();
    });
  });
}

document.getElementById("addExBtn").onclick = ()=>{
  const p = getPlan(currentDay);
  const first = (LIBRARY[currentDay] || LIBRARY.bryst).items[0];
  p.push({name:first.name, icon:first.icon, reps:first.reps, n:3});
  savePlan(currentDay, p);
  renderDay();
  window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
};

document.getElementById("restoreBtn").onclick = ()=>{
  if(!confirm("Gendan standardøvelserne for " + PROGRAM[currentDay].label + "?\n(Dine tal slettes ikke.)")) return;
  localStorage.removeItem(keyPlan(currentDay));
  renderDay();
  showToast("Standardprogram gendannet");
};

/* ---------- Toast ---------- */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ---------- Gem træning ----------
   Rykker dagens tal over i de to Sidst-kolonner og tømmer felterne,
   så du står klar til næste træning. */
document.getElementById("saveBtn").onclick = ()=>{
  const log = loadJSON(keyLog(currentDay), {});
  const plan = getPlan(currentDay);
  const t = todayISO();
  let moved = 0;

  plan.forEach(ex=>{
    for(let si=0; si<ex.n; si++){
      const e = log[setKey(ex.name, si)];
      if(e && (has(e.w) || has(e.r))) moved++;
    }
  });

  if(!moved){ showToast("Ingen tal at gemme"); return; }
  if(!confirm(`Gem træningen?\n${moved} sæt rykkes over i "Sidst", og felterne tømmes.`)) return;

  plan.forEach(ex=>{
    for(let si=0; si<ex.n; si++){
      const e = log[setKey(ex.name, si)];
      if(e && (has(e.w) || has(e.r))){
        e.pw = e.w; e.pr = e.r; e.pd = t;
        e.w = ""; e.r = ""; e.done = false;
      }
    }
  });

  saveJSON(keyLog(currentDay), log);
  localStorage.setItem(keySaved(currentDay), t);
  renderDay();
  showToast(`Træning gemt ✓ ${moved} sæt ligger nu under Sidst`);
};

/* ---------- Ryd felterne (historikken røres ikke) ---------- */
document.getElementById("resetBtn").onclick = ()=>{
  if(!confirm("Ryd det du har tastet ind for " + PROGRAM[currentDay].label + "?\n(Sidst-tallene bevares.)")) return;
  const log = loadJSON(keyLog(currentDay), {});
  Object.values(log).forEach(e=>{ if(e){ e.w = ""; e.r = ""; e.done = false; } });
  saveJSON(keyLog(currentDay), log);
  renderDay();
};

function renderAll(){ renderTabs(); renderDay(); }
renderAll();
</script>
